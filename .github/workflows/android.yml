name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['web/**', '.github/workflows/android.yml', '.github/releases/**']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Publish a release for this tag (e.g. v1.1.0). It is created on the selected branch if it does not exist.'
        required: false

permissions:
  contents: write # publish GitHub Releases

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Release or test build?
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="$INPUT_TAG"; fi
          if [[ -n "$TAG" ]]; then
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag must look like v1.2.3, got '$TAG'"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "name=0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      # ubuntu-latest ships the Android SDK (ANDROID_HOME); no setup action needed.
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      # ── Test builds (PRs, main): debug APK as a workflow artifact ──────────
      - name: Debug APK
        if: steps.ver.outputs.release != 'true'
        working-directory: web/android
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionName=${{ steps.ver.outputs.name }}

      - uses: actions/upload-artifact@v4
        if: steps.ver.outputs.release != 'true'
        with:
          name: x22-debug-${{ steps.ver.outputs.name }}
          path: web/android/app/build/outputs/apk/debug/app-debug.apk

      # ── Releases: signed APK on the Releases page ──────────────────────────
      - name: Signed release APK
        if: steps.ver.outputs.release == 'true'
        working-directory: web/android
        env:
          KEYSTORE_B64: ${{ secrets.X22_KEYSTORE_BASE64 }}
          X22_KEYSTORE_PASSWORD: ${{ secrets.X22_KEYSTORE_PASSWORD }}
          X22_KEY_ALIAS: ${{ secrets.X22_KEY_ALIAS }}
          X22_KEY_PASSWORD: ${{ secrets.X22_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$X22_KEYSTORE_PASSWORD" ] || [ -z "$X22_KEY_ALIAS" ] || [ -z "$X22_KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing (X22_KEYSTORE_BASE64, X22_KEYSTORE_PASSWORD, X22_KEY_ALIAS, X22_KEY_PASSWORD). Not publishing an unsigned release."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/x22.jks"
          X22_KEYSTORE_FILE="$RUNNER_TEMP/x22.jks" ./gradlew assembleRelease \
            -PversionCode=${{ github.run_number }} -PversionName=${{ steps.ver.outputs.name }}
          rm "$RUNNER_TEMP/x22.jks"
          # Fixed name so releases/latest/download/x22-android.apk always works.
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/x22-android.apk"

      - name: Release notes
        if: steps.ver.outputs.release == 'true'
        id: notes
        working-directory: .
        run: |
          NOTES=".github/releases/${{ steps.ver.outputs.tag }}.md"
          [ -f "$NOTES" ] || { echo "::error::Missing $NOTES"; exit 1; }
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.release == 'true'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: x22 ${{ steps.ver.outputs.name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: ${{ runner.temp }}/x22-android.apk
          generate_release_notes: false
          make_latest: true
