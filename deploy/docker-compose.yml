# x22 stack: Caddy (HTTPS + app) and the uploader, next to your existing Navidrome.
#
#   cp .env.example .env    # then edit it
#   # put cert.pem + key.pem in ./certs (see certs/README.md)
#   docker compose up -d --build

name: x22

services:
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    environment:
      NAVIDROME_UPSTREAM: ${NAVIDROME_URL:-http://192.168.0.100:4533}
      SITE_NAME: ${SITE_NAME:-192.168.0.100}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ./certs:/certs:ro
      - caddy-data:/data
    depends_on:
      - uploader

  uploader:
    build:
      context: ../uploader
    restart: unless-stopped
    # Run as the user that owns your music folder so Navidrome can read new files.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      NAVIDROME_URL: ${NAVIDROME_URL:-http://192.168.0.100:4533}
      MUSIC_DIR: /music
      UPLOAD_SUBDIR: ${UPLOAD_SUBDIR:-Uploads}
      MAX_FILE_MB: ${MAX_FILE_MB:-2000}
      ALLOWED_USERS: ${ALLOWED_USERS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,https://localhost,capacitor://localhost}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    volumes:
      - ${MUSIC_DIR:?Set MUSIC_DIR in .env to your Navidrome music folder}:/music
    # No published port: only reachable through Caddy at /api.

volumes:
  caddy-data:
